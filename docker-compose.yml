services:
  app:
    build:
      context: .
      target: runner
    image: gym-management-services-nest:latest
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3500:3500"
    networks:
      - backend-net

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USERNAME}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DATABASE}
      TZ: Asia/Colombo
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USERNAME} -d ${PG_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend-net

volumes:
  pgdata:

networks:
  backend-net:
    driver: bridge
